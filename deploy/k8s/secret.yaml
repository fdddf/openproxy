# Replace the placeholder before applying, or create the secret imperatively:
#
#   kubectl create secret generic openproxy-secrets \
#     --from-literal=JWT_SIGN_KEY="$(openssl rand -hex 32)"
#
# The key may also be left out entirely: one is generated and stored in the
# database on first start. Pinning it here keeps sessions valid across a
# database reset and across a switch to a fresh volume.
apiVersion: v1
kind: Secret
metadata:
  name: openproxy-secrets
  labels:
    app.kubernetes.io/name: openproxy
type: Opaque
stringData:
  JWT_SIGN_KEY: "replace-me-with-openssl-rand-hex-32"
  # Only read when DB_DRIVER=postgres:
  # DB_PASSWORD: "your-postgres-password"
