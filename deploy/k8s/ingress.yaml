# Optional. The proxy terminates no TLS of its own, so put it behind an ingress
# (or another TLS terminator) before exposing it outside the cluster.
# Adjust the host, ingress class, and issuer to match your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openproxy
  labels:
    app.kubernetes.io/name: openproxy
  annotations:
    # Streaming responses must not be buffered by the proxy in front.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - openproxy.example.com
  #     secretName: openproxy-tls
  rules:
    - host: openproxy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openproxy
                port:
                  name: http
