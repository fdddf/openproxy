name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and upload the binaries as workflow artifacts without
  # publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The admin UI is embedded into every binary, so it is built once and reused
  # by each matrix target instead of running npm on all six.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build admin UI
        run: cd ui && npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src/internal/web/dist
          retention-days: 1

  build:
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Restore admin UI
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/internal/web/dist

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # SQLite is the pure-Go modernc driver, so every target cross-compiles
          # without a C toolchain.
          CGO_ENABLED: '0'
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME}"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          NAME="openproxy_${VERSION}_${GOOS}_${GOARCH}"
          OUT="dist/${NAME}"
          BIN="openproxy"
          if [ "$GOOS" = "windows" ]; then BIN="openproxy.exe"; fi
          mkdir -p "$OUT"
          cd src
          go build -trimpath \
            -ldflags "-s -w -X github.com/fdddf/openproxy/pkg/version.Commit=${VERSION} -X github.com/fdddf/openproxy/pkg/version.BuildDate=${BUILD_DATE}" \
            -o "../${OUT}/${BIN}" .
          cd ..
          cp README.md "$OUT/"
          cp src/config.example.yaml "$OUT/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -r "${NAME}.zip" "$NAME"
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: openproxy_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: openproxy_*
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
